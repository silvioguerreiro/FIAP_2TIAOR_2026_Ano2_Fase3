; CardioIA Fase 3, Parte 2 (Fog/Cloud): projeto PlatformIO para compilar o sketch.ino desta pasta
; (requer config.h nesta pasta; use config.example.h ou config.broker_publico.h como modelo).
[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<sketch.ino>
lib_deps =
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit BusIO@^1.16.1
    knolleary/PubSubClient@^2.8
